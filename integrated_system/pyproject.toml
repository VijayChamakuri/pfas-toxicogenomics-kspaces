[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pfas-workflow-guardrails"
version = "0.1.0"
description = "Constrained workflow planning over verified PFAS toxicogenomics artifacts"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "pandas>=2.2,<4", "pydantic>=2.10,<3", "uvicorn>=0.34,<1"]

[project.optional-dependencies]
dev = ["httpx>=0.28,<1", "pytest>=8.3,<10", "ruff>=0.11,<1", "mypy>=1.17,<2", "nbformat>=5.10,<6", "nbconvert>=7.16,<8", "ipykernel>=6.29,<8"]
openai = ["openai>=1.75,<3"]
ml = ["torch==2.7.0", "tensorflow==2.20.0"]
finetune = ["transformers>=4.45,<5", "datasets>=3,<5", "peft>=0.13,<1", "accelerate>=1,<2"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["tests/fixtures/*.ipynb"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true

[tool.hatch.build.targets.wheel]
packages = ["src/pfas_workflow", "ml_frameworks", "llm_system"]
